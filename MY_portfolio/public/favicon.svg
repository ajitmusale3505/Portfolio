<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07091c"/>
      <stop offset="55%" stop-color="#0a1740"/>
      <stop offset="100%" stop-color="#061a38"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3fd4"/>
      <stop offset="45%" stop-color="#7657ff"/>
      <stop offset="100%" stop-color="#18e8ff"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d6bff"/>
      <stop offset="55%" stop-color="#167cff"/>
      <stop offset="100%" stop-color="#20e7e7"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff32d0"/>
      <stop offset="50%" stop-color="#8b5cff"/>
      <stop offset="100%" stop-color="#19e7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Premium favicon background -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none"
        stroke="url(#border)" stroke-width="7" filter="url(#glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none"
        stroke="#4c75d8" stroke-opacity=".28" stroke-width="2"/>

  <!-- subtle ambient glow -->
  <ellipse cx="390" cy="112" rx="145" ry="105" fill="#126cff" opacity=".12" filter="url(#soft)"/>
  <ellipse cx="120" cy="390" rx="120" ry="100" fill="#b52cff" opacity=".10" filter="url(#soft)"/>

  <!-- code symbol -->
  <g transform="translate(0,-2)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" filter="url(#glow)">
    <path d="M190 126 L145 164 L190 202" stroke="#bd4dff"/>
    <path d="M322 126 L367 164 L322 202" stroke="#1ee5ff"/>
    <path d="M273 112 L239 216" stroke="#4b78ff"/>
  </g>

  <!-- AM monogram -->
  <g>
    <!-- A -->
    <path d="M82 365 L171 224 L260 365 L218 365 L197 329 L145 329 L124 365 Z
             M161 299 L181 299 L171 278 Z"
          fill="#f7f9ff"/>
    <path d="M82 365 L171 224 L260 365" fill="none" stroke="#d86aff" stroke-width="4" opacity=".7"/>
    <!-- M -->
    <path d="M215 365 L215 239 L257 239 L303 294 L349 239 L391 239 L391 365
             L349 365 L349 298 L303 350 L257 298 L257 365 Z"
          fill="url(#m)"/>
  </g>

  <!-- signature swoosh -->
  <path d="M73 356 C185 328 276 326 438 259 C355 329 246 374 112 390"
        fill="none" stroke="#050817" stroke-width="18" opacity=".9"/>
  <path d="M73 350 C185 322 276 320 438 253 C355 323 246 368 112 384"
        fill="none" stroke="url(#swoosh)" stroke-width="8" filter="url(#glow)"/>

  <!-- Name -->
  <text x="256" y="425" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800"
        letter-spacing="5" fill="#ffffff">AJIT <tspan fill="#20dff5">MUSALE</tspan></text>

  <!-- Small developer label -->
  <text x="256" y="454" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600"
        letter-spacing="4" fill="#d8e2ff">FULL STACK DEVELOPER</text>

  <!-- accent lines -->
  <path d="M70 425 H116" stroke="#ff35d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M396 425 H442" stroke="#20e5ff" stroke-width="3" stroke-linecap="round"/>
</svg>